name: App build and test

on:
  push:
    branches:
      - master
      - release
      - 'release/**'
      - 'experimental/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
    - name: Resolve OS matrix
      id: matrix
      shell: pwsh
      run: |
        $ref = "${{ github.ref }}"
        # Release branches validate both architectures; other branches build x64 only to save CI minutes.
        if ($ref -eq "refs/heads/release" -or $ref.StartsWith("refs/heads/release/"))
        {
          $os = '["windows-latest", "windows-11-arm"]'
        }
        else
        {
          $os = '["windows-latest"]'
        }

        "os=$os" >> $env:GITHUB_OUTPUT

  build-and-test:
    name: ${{ matrix.os }}
    needs: setup
    # 'release' defaults to false, so this is a CI build: it runs tests and does not package.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup.outputs.os) }}
    uses: ./.github/workflows/_app-build-core.yml
    with:
      os: ${{ matrix.os }}

  # Linux leg (docs/avalonia-port/CROSS-PLATFORM.md): the whole solution must build on Linux, and its tests run there, the
  # headless Avalonia tests included (phase 2). NUnit skips the Windows-only assemblies (UI.IntegrationTests) and tests
  # ([Platform(Include = "Win")]).
  build-linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Install fonts
      # The headless Avalonia tests measure text with the fonts of the system.
      run: sudo apt-get install -y -q fonts-dejavu-core fontconfig

    - name: Build .NET
      run: dotnet build -c Release --verbosity q --nologo /p:ContinuousIntegrationBuild=true /bl:artifacts/log/build.binlog

    - name: Run tests
      # As on Windows: one test host at a time, and a per-test hang timeout.
      run: dotnet test -c Release -m:1 --no-restore --no-build --nologo --verbosity q --logger:trx --blame-hang-timeout 3m --blame-hang-dump-type mini /bl:artifacts/log/tests.binlog

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: test-results-linux
        path: 'artifacts/Release/TestsResults/**/*.trx'
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload build logs on failure
      if: failure() || cancelled()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: build-logs-ubuntu-latest
        path: |
          artifacts/**/log/**/*.binlog
          **/Sequence_*.xml
          **/*.dmp
        retention-days: 7
        if-no-files-found: ignore

  # Single aggregate status that branch protection can require instead of the per-architecture matrix legs. The build matrix is dynamic
  # (pull requests build only 'windows-latest' while release branches also build 'windows-11-arm'), so requiring individual legs would
  # either miss coverage or block on a check that never runs. This gate always runs and passes only when every matrix leg succeeded.
  # Require the 'Build gate' status check in branch protection.
  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    needs: [build-and-test, build-linux]
    if: always()
    steps:
    - name: Verify build matrix succeeded
      shell: bash
      run: |
        result="${{ needs.build-and-test.result }}"
        linux="${{ needs.build-linux.result }}"
        echo "build-and-test result: $result, build-linux result: $linux"
        if [ "$result" != "success" ] || [ "$linux" != "success" ]; then
          echo "::error::One or more build/test legs did not succeed (Windows: $result, Linux: $linux)."
          exit 1
        fi

  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [build-and-test, build-linux]
    if: always() && needs.build-and-test.outputs.has-test-results == 'true'
    permissions:
      actions: read
      contents: read
      checks: write

    steps:
    - name: Checkout
      # test-reporter runs 'git ls-files' to map test results to source files; without a working tree it fails with exit 128.
      # Must run before downloading artifacts: checkout cleans the working directory and would otherwise wipe the results.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download test results
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        # Gather every per-architecture test-results artifact produced by the build matrix.
        pattern: test-results-*
        path: test-results
        merge-multiple: true

    - name: Create test report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
        max-annotations: 50  # do not increase over the allowed maximum of 50
